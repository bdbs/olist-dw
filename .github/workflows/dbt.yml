name: dbt CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: python scripts/02_generate_synthetic_data.py

      - name: Load raw data
        run: python scripts/03_load_raw.py

      - name: Build models
        run: dbt run --profiles-dir .

      - name: Run tests
        run: dbt test --profiles-dir .

      - name: Generate docs
        if: success()
        run: dbt docs generate --profiles-dir .
